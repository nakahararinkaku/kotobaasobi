<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ことばあそび</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=public" />
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div id="abyss" aria-hidden="true"></div>
    <div id="words" aria-live="polite"></div>

    <form class="composer" id="composer">
      <label class="visually-hidden" for="sentence">文章</label>
      <div class="composer-glass">
        <textarea
          id="sentence"
          name="sentence"
          rows="1"
          maxlength="240"
          placeholder="言いたいことはなんだった？"
          autocomplete="off"
        ></textarea>
      </div>
    </form>

    <script src="app.js?v=public" type="module"></script>
  </body>
</html>
